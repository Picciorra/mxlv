<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MXLV - Classifica</title>
  <meta name="theme-color" content="#0D0F12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MXLV">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo">MXLV</span>
        <span class="muted">Stagione 2026</span>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Aggiorna la classifica">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
      </button>
    </header>

    <div class="title-block">
      <h1>Classifica</h1>
      <p class="muted" id="subtitle">Caricamento...</p>
    </div>

    <main id="content" aria-live="polite">
      <div class="skeleton podium-skel"></div>
      <div class="skeleton row-skel"></div>
      <div class="skeleton row-skel"></div>
      <div class="skeleton row-skel"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
